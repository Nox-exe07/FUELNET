name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  modal:
    name: FuelNet production
    runs-on: ubuntu-latest

    steps:
      - name: Verify live site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://nagavarundaddanala--fuelnet-web.us-east.modal.run/health

      - name: Record GitHub deployment
        uses: actions/github-script@v7
        with:
          script: |
            const environmentUrl = 'https://nagavarundaddanala--fuelnet-web.us-east.modal.run';
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'production',
              description: 'FuelNet Modal production',
              auto_merge: false,
              required_contexts: [],
              production_environment: true,
              transient_environment: false,
            });
            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deployment.data.id,
              state: 'success',
              environment_url: environmentUrl,
              log_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              description: 'Live on Modal',
            });
