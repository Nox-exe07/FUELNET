name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  modal:
    name: FuelNet production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://nagavarundaddanala--fuelnet-web.us-east.modal.run

    steps:
      - name: Verify live site
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5 \
            https://nagavarundaddanala--fuelnet-web.us-east.modal.run/health

      - name: Write deployment summary
        run: |
          echo "### FuelNet is live" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "https://nagavarundaddanala--fuelnet-web.us-east.modal.run" >> "$GITHUB_STEP_SUMMARY"
